# Serves the runner's data/public, and nothing else under /data, to the app.
server {
    listen 80;
    root /data/public;
    autoindex off;

    add_header Access-Control-Allow-Origin "*" always;

    location / {
        try_files $uri =404;
    }

    # Changes with every snapshot and close.
    location = /latest.json {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Named after their root and never rewritten.
    location /trees/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
}
